# 每天自动抓新闻、生成摘要并发邮件。
# GitHub 的定时任务按世界时（UTC）计算：
# 0 0 * * *  = 每天 08:00（北京时间）
name: Daily Tech Digest

on:
  schedule:
    - cron: "0 0 * * *"
  # 允许你在 GitHub 网页上点「Run workflow」立刻跑一次，方便测试
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行摘要脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python news_digest.py
